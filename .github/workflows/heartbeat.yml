name: Keep-Alive Heartbeat

on:
  schedule:
    - cron: '*/14 * * * *' # Every 14 minutes to beat Render's 15-min sleep timer
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  ping:
    name: Heartbeat Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          URL="https://scoutedge-live.onrender.com/api"
          echo "Pinging $URL..."
          curl -s -f $URL || echo "Ping failed, but continuing..."
